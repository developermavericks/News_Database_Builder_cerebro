services:
  db:
    image: postgres:16-alpine
    container_name: nexus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: nexus_backend
    restart: unless-stopped
    volumes:
      - ./debug-9146a2.dir:/app/debug
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_scraper
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker_priority:
    build:
      context: ./backend
    container_name: nexus_worker_priority
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -P solo -Q priority --concurrency=1
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_scraper
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      WEBSHARE_PROXY_USER: ${WEBSHARE_PROXY_USER}
      WEBSHARE_PROXY_PASS: ${WEBSHARE_PROXY_PASS}
      WEBSHARE_PROXY_HOST: ${WEBSHARE_PROXY_HOST}
      WEBSHARE_IP_AUTH: ${WEBSHARE_IP_AUTH}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker_celery:
    build:
      context: ./backend
    container_name: nexus_worker_celery
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -Q celery --concurrency=4
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_scraper
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      WEBSHARE_PROXY_USER: ${WEBSHARE_PROXY_USER}
      WEBSHARE_PROXY_PASS: ${WEBSHARE_PROXY_PASS}
      WEBSHARE_PROXY_HOST: ${WEBSHARE_PROXY_HOST}
      WEBSHARE_IP_AUTH: ${WEBSHARE_IP_AUTH}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build:
      context: ./backend
    container_name: nexus_beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_scraper
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: nexus_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
